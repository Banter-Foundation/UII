[package]
name = "uii"
version = "0.1.0"
edition = "2021"
description = "UII desktop shell. GLFW, OpenGL, and Banter's Dear ImGui docking build."
publish = false

[dependencies]
dear-imgui-glow = "0.22"
dear-imgui-rs = "0.22"
glow = "0.18"
glfw = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
