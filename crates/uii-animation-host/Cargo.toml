[package]
name = "uii-animation-host"
version = "0.1.0"
edition = "2021"
description = "Standalone GLFW host for the UII Animation tab."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "uii-animation"
path = "src/main.rs"

[dependencies]
dear-imgui-glow = "0.22"
dear-imgui-rs = "0.22"
glow = "0.18"
glfw = "0.63"
uii-animation = { path = "../uii-animation" }
