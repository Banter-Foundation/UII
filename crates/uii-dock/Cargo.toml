[package]
name = "uii-dock"
version = "0.1.0"
edition = "2021"
description = "Assets and Components content drawer. Folders, assets, and the collapsible dock."
license = "MIT OR Apache-2.0"
publish = false
autobins = false

[[bin]]
name = "uii-dock"
path = "src/main.rs"

[dependencies]
dear-imgui-glow = "0.22"
dear-imgui-rs = "0.22"
glow = "0.18"
glfw = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
